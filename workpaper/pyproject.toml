[project]
name = "tax-workpaper"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.142.0", "starlette==1.6.0", "pydantic==2.13.5", "uvicorn==0.53.0"]

[tool.ruff]
line-length = 180
target-version = "py311"
extend-exclude = ["static", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = [
  "E501",    # long lines: reports and messages read better unwrapped
  "S101",    # asserts are fine in tests
  "RUF001", "RUF002", "RUF003",  # typographic characters in user-facing text are intended
  "SIM108",
  "B008",    # FastAPI Header() defaults
  "RUF012",
  "UP038",   # isinstance tuples are clearer than unions here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
