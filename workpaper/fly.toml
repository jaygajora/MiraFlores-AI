# fly launch --copy-config --no-deploy && fly volumes create workpaper_data --size 1 && fly deploy
app = "tax-workpaper"
primary_region = "sjc"

[build]

[env]
  DB_PATH = "/data/workpaper.db"
  PORT = "8000"

[mounts]
  source = "workpaper_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
