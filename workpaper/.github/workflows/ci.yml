name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and API tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Type-check, bundle, build CSS
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-app
          path: static/app

  browser:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: static-app
          path: static/app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - name: Start the app on a fresh log
        run: |
          DB_PATH="$RUNNER_TEMP/ci.db" python -m uvicorn app.main:app --port 8765 &
          for i in $(seq 1 30); do curl -sf localhost:8765/api/health && break; sleep 1; done
      - name: Browser smoke test (every role, desktop and phone width)
        run: python tests/e2e_smoke.py http://127.0.0.1:8765
